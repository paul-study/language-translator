<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🌐 Language Translator</h1>
        
        <div class="translator-box">
            <div class="language-select">
                <select id="fromLanguage">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="zh">Chinese</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                </select>
                
                <button class="swap-btn" id="swapBtn" title="Swap Languages">⇄</button>
                
                <select id="toLanguage">
                    <option value="es">Spanish</option>
                    <option value="en">English</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="zh">Chinese</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                </select>
            </div>
            
            <div class="text-areas">
                <div class="text-box">
                    <label for="inputText">Enter text to translate:</label>
                    <textarea id="inputText" placeholder="Type or paste text here..."></textarea>
                </div>
                
                <div class="text-box">
                    <label for="outputText">Translation:</label>
                    <textarea id="outputText" readonly placeholder="Translation will appear here..."></textarea>
                </div>
            </div>
            
            <button class="translate-btn" id="translateBtn">Translate</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
